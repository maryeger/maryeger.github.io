<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102321">
  <title>Мария Егерь инфоо</title>

  <!-- Кириллический рукописный шрифт для ника -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "DepartureMono";
      src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --tiffany: #54dfd1;
      --tiffany-light: #a1fff5;
      --pink: #ff91b8;
      --dark: #10191a;
      --text: #eafffa;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: Montserrat, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(48,213,200,.28), transparent 34%),
        radial-gradient(ellipse at 88% 76%, rgba(255,145,184,.18), transparent 32%),
        radial-gradient(ellipse at 52% 48%, #153d3b 0%, #10191a 72%);
      background-attachment: fixed;
    }

    /* Одинаковые Apple-style emoji-картинки на всех устройствах */
    .floaty {
      position: fixed;
      z-index: 0;
      display: block;
      width: var(--emoji-size, 52px);
      height: var(--emoji-size, 52px);
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      opacity: .9;
      filter: drop-shadow(0 0 9px rgba(84,223,209,.16));
      animation: drift 7s ease-in-out infinite;
    }
    .e1 { --emoji-size: 66px; top: 5%; left: 5%; animation-delay: -.8s; }
    .e2 { --emoji-size: 43px; top: 18%; right: 8%; animation-delay: -2s; }
    .e3 { --emoji-size: 42px; top: 37%; left: 8%; animation-delay: -3.5s; }
    .e4 { --emoji-size: 62px; top: 48%; right: 5%; animation-delay: -1.4s; }
    .e5 { --emoji-size: 48px; top: 68%; left: 4%; animation-delay: -4s; }
    .e6 { --emoji-size: 70px; top: 78%; right: 8%; animation-delay: -2.7s; }
    .e7 { --emoji-size: 38px; top: 91%; left: 17%; animation-delay: -1.1s; }
    .e8 { --emoji-size: 34px; top: 8%; right: 34%; animation-delay: -3s; }
    .e9 { --emoji-size: 32px; top: 57%; left: 19%; animation-delay: -4.6s; }
    .e10 { --emoji-size: 37px; top: 31%; right: 21%; animation-delay: -2.2s; }

    @keyframes drift {
      0%, 100% { transform: translate3d(0,0,0) rotate(-5deg); }
      50% { transform: translate3d(9px,-19px,0) rotate(7deg); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      padding: 54px 24px 42px;
    }

    .profile {
      position: relative;
      z-index: 2;
      width: min(100%, 540px);
      margin: 0 auto;
      text-align: center;
    }

    .info-label {
      margin: 0 0 24px;
      color: var(--tiffany);
      font-size: 13px;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .avatar {
      width: 154px;
      height: 154px;
      margin: 0 auto 25px;
      overflow: hidden;
      border: 5px solid var(--tiffany);
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb3cb, #30d5c8);
      box-shadow: 0 0 18px var(--tiffany), 0 0 48px rgba(48,213,200,.55);
    }
    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Ник: кириллица, каллиграфический шрифт, одна строка */
    .name {
      margin: 8px 0 8px;
      color: #54dfd1;
      font-family: "Marck Script", cursive;
      font-size: clamp(44px, 6.2vw, 70px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: .2px;
      white-space: nowrap;
      text-shadow: 3px 3px 0 #ff91b8, 0 0 23px rgba(48,213,200,.72);
    }

    .divider-mark {
      margin: 3px 0 15px;
      color: var(--tiffany);
      font-size: 39px;
      line-height: 1;
      text-shadow: 2px 2px 0 var(--pink), 0 0 18px var(--tiffany);
    }

    .tagline {
      margin: 0 0 30px;
      color: #ffc2d7;
      font-size: 13px;
      letter-spacing: 4px;
    }

    /* Иконки соцсетей: по сторонам на компьютере */
    .socials {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .social-link {
      position: absolute;
      display: grid;
      place-items: center;
      width: 104px;
      height: 104px;
      padding: 15px;
      border: 2px solid rgba(161,255,245,.72);
      border-radius: 50%;
      background: rgba(23,68,65,.55);
      box-shadow: 0 0 17px rgba(48,213,200,.35), inset 0 0 14px rgba(84,223,209,.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
      animation: iconFloat 5s ease-in-out infinite;
    }
    .social-link img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.2));
    }
    .social-link:hover,
    .social-link:focus-visible {
      transform: translateY(-8px) scale(1.09);
      background: rgba(84,223,209,.24);
      box-shadow: 0 0 25px var(--tiffany), 0 0 38px rgba(255,145,184,.32);
      outline: none;
    }
    /* Компьютер: иконки разбросаны вокруг центрального блока, как на референсе */
    .social-link:nth-child(1) { top: 24vh; left: 17%; animation-delay: -.5s; }       /* Steam — слева сверху */
    .social-link:nth-child(2) { top: 56vh; left: 12.5%; animation-delay: -1.8s; }   /* Instagram — слева ниже */
    .social-link:nth-child(3) { top: 24vh; right: 19.5%; animation-delay: -2.5s; }  /* TikTok — справа сверху */
    .social-link:nth-child(4) { top: 48vh; right: 16.5%; animation-delay: -3.2s; } /* Telegram — справа посередине */
    .social-link:nth-child(5) { top: 70vh; right: 20%; animation-delay: -1.2s; }   /* Discord — справа внизу */

    @keyframes iconFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -12px; }
    }

    /* Надпись FIND ME HERE — шрифт из DepartureMono.zip */
    .find-me {
      margin: 34px 0 28px;
      color: #ff9cbd;
      font-family: "DepartureMono", monospace;
      font-size: clamp(19px, 3vw, 25px);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 2px;
      line-height: 1.4;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 13px rgba(255,145,184,.22);
    }

    .bottom-note {
      margin: 32px 0 0;
      color: var(--tiffany);
      font-size: 11px;
      letter-spacing: 3px;
      line-height: 2;
    }

    /* На небольших окнах компьютера кружки чуть компактнее, чтобы не налезали на профиль */
    @media (min-width: 701px) and (max-width: 1100px) {
      .social-link { width: 82px; height: 82px; padding: 12px; }
      .social-link:nth-child(1) { left: 5%; }
      .social-link:nth-child(2) { left: 4%; }
      .social-link:nth-child(3) { right: 5%; }
      .social-link:nth-child(4) { right: 4%; }
      .social-link:nth-child(5) { right: 6%; }
    }

    /* Телефон: все пять иконок стоят одним рядом */
    @media (max-width: 700px) {
      .page { padding: 42px 15px 35px; }
      .profile { width: 100%; }
      .info-label { margin-bottom: 20px; }
      .avatar { width: 142px; height: 142px; }
      .name { font-size: clamp(37px, 10vw, 54px); }
      .tagline { font-size: 11px; letter-spacing: 3px; }

      .socials {
        position: relative;
        inset: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(7px, 2.5vw, 14px);
        width: 100%;
        margin: 30px auto 0;
        pointer-events: auto;
      }
      .social-link,
      .social-link:nth-child(n) {
        position: relative;
        inset: auto;
        flex: 0 0 clamp(48px, 13vw, 62px);
        width: clamp(48px, 13vw, 62px);
        height: clamp(48px, 13vw, 62px);
        padding: 8px;
        animation: iconFloat 5s ease-in-out infinite;
      }
      .social-link:nth-child(2) { animation-delay: -.8s; }
      .social-link:nth-child(3) { animation-delay: -1.6s; }
      .social-link:nth-child(4) { animation-delay: -2.4s; }
      .social-link:nth-child(5) { animation-delay: -3.2s; }

      .find-me { margin-top: 30px; font-size: 18px; letter-spacing: 1px; }
      .floaty { opacity: .65; }
      .e1 { --emoji-size: 48px; }
      .e4, .e6 { --emoji-size: 48px; }
    }

    @media (max-width: 360px) {
      .socials { gap: 6px; }
      .social-link,
      .social-link:nth-child(n) {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
        padding: 7px;
      }
      .name { font-size: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Apple-style emoji images: одинаково выглядят на Windows, Android и iPhone -->
  <img class="floaty e1" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1fab7.png" alt="" aria-hidden="true">
  <img class="floaty e2" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1f9ec.png" alt="" aria-hidden="true">
  <img class="floaty e3" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1f365.png" alt="" aria-hidden="true">
  <img class="floaty e4" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1f499.png" alt="" aria-hidden="true">
  <img class="floaty e5" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1f90d.png" alt="" aria-hidden="true">
  <img class="floaty e6" src="https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-64/1f33a.png" alt="" aria-hidden="true">

  <main class="page">
    <section class="profile">
      <p class="info-label">✦ INFO ✦</p>

      <div class="avatar">

      <div class="divider-mark" aria-hidden="true">x_x</div>

      <p class="find-me">FIND ME HERE ^^</p>

    <!-- На компьютере иконки расположены по бокам, на телефоне — одной линией -->
    <nav class="socials" aria-label="Мои социальные сети">
      <a class="social-link" href="https://steamcommunity.com/profiles/76561198607375630/" target="_blank" rel="noopener noreferrer" aria-label="Steam" title="Steam">
        <img src="assets/icons/steam.png" alt="">

      <a class="social-link" href="https://www.tiktok.com/@kittyeger" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">

      <a class="social-link" href="https://t.me/kittyeger" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">

      <a class="social-link" href="https://discord.com/users/1126013531494563922" target="_blank" rel="noopener noreferrer" aria-label="Discord" title="Discord">
        <img src="assets/icons/discord.png" alt="">
      </a>
    </nav>
  </main>
</body>
</html>
