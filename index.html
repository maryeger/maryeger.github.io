
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>my little world 🩵</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #10191a;
  color: #eafffa;
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ФОН */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 10% 20%, #30d5c855, transparent 30%),
    radial-gradient(circle at 90% 80%, #ff91b855, transparent 30%),
    radial-gradient(circle at 50% 50%, #153d3b, #10191a 75%);
  z-index: -2;
}

/* ДЕКОРАТИВНЫЕ СМАЙЛИКИ */
.flower {
  position: fixed;
  opacity: .8;
  z-index: -1;
  animation: float 5s ease-in-out infinite;
  pointer-events: none;
  user-select: none;
}

.f1 { top: 7%; left: 4%; font-size: 75px; }
.f2 { bottom: 10%; right: 5%; font-size: 75px; animation-delay: 1s; }
.f3 { top: 45%; right: 3%; font-size: 48px; }
.f4 { bottom: 25%; left: 3%; font-size: 55px; }
.f5 { top: 25%; left: 85%; font-size: 40px; }
.f6 { top: 70%; left: 12%; font-size: 35px; }
.f7 { top: 85%; left: 75%; font-size: 42px; }
.f8 { top: 15%; right: 15%; font-size: 35px; }
.f9 { top: 55%; left: 8%; font-size: 35px; }
.f10 { top: 35%; left: 15%; font-size: 35px; }

@keyframes float {
  50% {
    transform: translateY(-15px) rotate(10deg);
  }
}

/* ОСНОВНОЙ БЛОК */
.container {
  width: 90%;
  max-width: 520px;
  margin: auto;
  padding: 65px 0;
  text-align: center;
}

.tag {
  color: #30d5c8;
  font-size: 13px;
  letter-spacing: 5px;
  margin-bottom: 25px;
}

/* АВАТАРКА */
.avatar {
  width: 145px;
  height: 145px;
  margin: 0 auto 25px;
  border-radius: 50%;
  border: 4px solid #43e5d5;
  box-shadow:
    0 0 20px #30d5c8,
    0 0 45px #30d5c855;
  overflow: hidden;
  background: #ffb3cb;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ИМЯ */
h1 {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(45px, 12vw, 75px);
  color: #43e5d5;
  text-shadow:
    3px 3px #ff8db7,
    0 0 25px #30d5c8;
  transform: rotate(-3deg);
  margin-bottom: 20px;
}

.subtitle {
  color: #ffc2d7;
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 28px;
}

.description {
  font-size: 14px;
  line-height: 1.8;
  color: #d6e9e5;
  margin-bottom: 30px;
}

/* ДЕКОРАТИВНЫЕ НАДПИСИ */
.sticker {
  font-family: 'Permanent Marker', cursive;
  color: #ff9cbd;
  font-size: 24px;
  transform: rotate(-7deg);
  margin: 35px 0;
}

.symbols {
  font-size: 25px;
  letter-spacing: 8px;
  margin: 25px 0;
}

/* СОЦСЕТИ */
.links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.links a {
  text-decoration: none;
  color: #102a29;
  background: #54dfd1;
  padding: 17px;
  border-radius: 5px;
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 13px;
  border: 2px solid #a1fff5;
  box-shadow: 5px 5px 0 #ff91b8;
  transition: .3s;
}

.links a:hover {
  transform: translate(-4px, -4px);
  background: #ffb0ca;
  box-shadow: 8px 8px 0 #30d5c8;
}

.footer {
  margin-top: 45px;
  color: #65dcd1;
  font-size: 11px;
  letter-spacing: 3px;
  line-height: 2;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */
@media (max-width: 400px) {
  .flower {
    opacity: .55;
  }

  .container {
    padding-top: 50px;
  }
}
</style>
</head>
